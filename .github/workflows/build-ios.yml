name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build IPA (iOS App)
        run: yes | flet build ipa

      # เพิ่มขั้นตอนเช็กที่อยู่ไฟล์เพื่อความชัวร์
      - name: Find and Show IPA path
        run: find . -name "*.ipa"

      - name: Upload iOS App File
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: |
            build/ios/ipa/*.ipa
            build/ipa/*.ipa
            **/output/*.ipa
            *.ipa
          if-no-files-found: ignore
