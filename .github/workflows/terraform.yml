name: Build iOS App

on:
  workflow_dispatch: # ทำให้เรากดสั่งรันเองได้

jobs:
  build:
    runs-on: macos-latest # สั่งให้ใช้เครื่อง Mac ประมวลผล

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build IPA (iOS App)
        run: flet build ipa

      - name: Upload iOS App File
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: build/ipa/*.ipa
