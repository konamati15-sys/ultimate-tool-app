name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build IPA (iOS App)
        # ใช้ echo ส่งตัว y เข้าไปตอบตกลงอัตโนมัติ เพื่อป้องกันระบบค้างรอคนกด
        run: echo "y" | flet build ipa

      - name: Upload iOS App File
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: build/ipa/*.ipa
